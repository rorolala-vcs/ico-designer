<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ico-designer</title>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='white'/%3E%3Cpath d='M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' fill='black'/%3E%3C/svg%3E"
        />
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div id="app">
            <header id="topbar">
                <div class="brand" title="ico-designer">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"
                            fill="currentColor"
                            stroke="none"
                        />
                    </svg>
                </div>
                <div class="top-actions">
                    <button
                        class="icon-btn"
                        id="btn-new"
                        title="New config (N)"
                        aria-label="New config"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="btn-duplicate"
                        title="Duplicate config (D)"
                        aria-label="Duplicate"
                    >
                        <svg viewBox="0 0 24 24">
                            <rect x="8" y="8" width="11" height="11" />
                            <path d="M8 5H5v11" />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="btn-delete"
                        title="Delete config (Shift+Delete)"
                        aria-label="Delete"
                    >
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"
                            />
                        </svg>
                    </button>
                    <span class="top-sep"></span>
                    <button
                        class="icon-btn"
                        id="btn-art"
                        title="Art studio (A)"
                        aria-label="Art studio"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M4 4h16v16H4z" />
                            <path
                                d="M4 9.33h16M4 14.66h16M9.33 4v16M14.66 4v16"
                            />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="btn-raw"
                        title="Edit TOML (E)"
                        aria-label="Edit TOML"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M9 6 4 12l5 6M15 6l5 6-5 6" />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="btn-generate"
                        title="Generate artifacts (G)"
                        aria-label="Generate"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v11M8 10l4 4 4-4" />
                            <path d="M4 17v3h16v-3" />
                        </svg>
                    </button>
                    <button
                        class="icon-btn"
                        id="btn-help"
                        title="Shortcuts (?)"
                        aria-label="Help"
                    >
                        <svg viewBox="0 0 24 24">
                            <path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 1-1 1.7v.5" />
                            <path d="M12 17.5v.1M4 4h16v16H4z" />
                        </svg>
                    </button>
                    <span
                        class="save-state"
                        id="save-state"
                        title="Saved"
                    ></span>
                </div>
            </header>

            <nav id="filmstrip" aria-label="Configs"></nav>

            <main id="stage">
                <div id="canvas-wrap" class="bg-checker">
                    <canvas
                        id="preview-canvas"
                        width="640"
                        height="640"
                        aria-label="Icon preview"
                    ></canvas>
                    <div
                        id="sticker-marker"
                        class="sticker-marker hidden"
                    ></div>
                    <div id="stage-message" class="stage-message hidden"></div>
                </div>
                <footer id="stage-status">
                    <span id="status-name">—</span>
                    <span id="status-meta"></span>
                </footer>
                <div id="status-error" class="status-error hidden"></div>
            </main>

            <aside id="inspector">
                <section class="panel">
                    <div class="panel-head">
                        <span class="panel-title">Category</span>
                        <span class="panel-kicker" id="category-note"></span>
                    </div>
                    <div class="category-grid" id="category-grid"></div>
                </section>

                <section class="panel">
                    <div class="panel-head">
                        <span class="panel-title">Colors</span>
                        <span class="panel-kicker">ID MAP</span>
                    </div>
                    <div id="id-list" class="id-list"></div>
                </section>

                <section class="panel" id="panel-fill">
                    <div class="panel-head">
                        <span class="panel-title" id="fill-title">GreenId</span>
                        <span class="panel-kicker" id="fill-role">PRIMARY</span>
                    </div>
                    <div class="seg" id="fill-types" role="tablist">
                        <button
                            data-fill="solid"
                            title="Solid color"
                            aria-label="Solid"
                        >
                            <svg viewBox="0 0 24 24">
                                <rect
                                    x="4"
                                    y="4"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    stroke="none"
                                />
                            </svg>
                        </button>
                        <button
                            data-fill="linear"
                            title="Linear gradient"
                            aria-label="Linear"
                        >
                            <svg viewBox="0 0 24 24">
                                <defs>
                                    <linearGradient
                                        id="ico-lg"
                                        x1="0"
                                        y1="0"
                                        x2="1"
                                        y2="1"
                                    >
                                        <stop
                                            offset="0"
                                            stop-color="currentColor"
                                        />
                                        <stop
                                            offset="1"
                                            stop-color="currentColor"
                                            stop-opacity=".15"
                                        />
                                    </linearGradient>
                                </defs>
                                <rect
                                    x="4"
                                    y="4"
                                    width="16"
                                    height="16"
                                    fill="url(#ico-lg)"
                                    stroke="none"
                                />
                            </svg>
                        </button>
                        <button
                            data-fill="radial"
                            title="Radial gradient"
                            aria-label="Radial"
                        >
                            <svg viewBox="0 0 24 24">
                                <defs>
                                    <radialGradient id="ico-rg">
                                        <stop
                                            offset="0"
                                            stop-color="currentColor"
                                        />
                                        <stop
                                            offset="1"
                                            stop-color="currentColor"
                                            stop-opacity=".1"
                                        />
                                    </radialGradient>
                                </defs>
                                <rect
                                    x="4"
                                    y="4"
                                    width="16"
                                    height="16"
                                    fill="url(#ico-rg)"
                                    stroke="none"
                                />
                            </svg>
                        </button>
                        <button
                            data-fill="conic"
                            title="Conic gradient"
                            aria-label="Conic"
                        >
                            <svg viewBox="0 0 24 24">
                                <defs>
                                    <linearGradient
                                        id="ico-cg"
                                        x1="0"
                                        y1="0"
                                        x2="1"
                                        y2="1"
                                    >
                                        <stop
                                            offset="0"
                                            stop-color="currentColor"
                                        />
                                        <stop
                                            offset=".5"
                                            stop-color="currentColor"
                                            stop-opacity=".3"
                                        />
                                        <stop
                                            offset="1"
                                            stop-color="currentColor"
                                        />
                                    </linearGradient>
                                </defs>
                                <rect
                                    x="4"
                                    y="4"
                                    width="16"
                                    height="16"
                                    fill="url(#ico-cg)"
                                    stroke="none"
                                />
                            </svg>
                        </button>
                        <button
                            data-fill="pattern"
                            title="Tiled pattern"
                            aria-label="Pattern"
                        >
                            <svg viewBox="0 0 24 24">
                                <circle
                                    cx="8"
                                    cy="8"
                                    r="2"
                                    fill="currentColor"
                                    stroke="none"
                                />
                                <circle
                                    cx="16"
                                    cy="16"
                                    r="2"
                                    fill="currentColor"
                                    stroke="none"
                                />
                                <rect x="4" y="4" width="16" height="16" />
                            </svg>
                        </button>
                    </div>

                    <div class="fill-pane" id="pane-solid">
                        <button
                            type="button"
                            class="color-block"
                            id="solid-color"
                            title="Pick color"
                        >
                            <span
                                class="color-block-fill"
                                id="solid-swatch"
                            ></span>
                            <span class="color-block-code" id="solid-code"
                                >#1976D2</span
                            >
                        </button>
                        <input
                            id="solid-hex"
                            class="hex-input"
                            type="text"
                            spellcheck="false"
                            autocomplete="off"
                            aria-label="Hex color"
                        />
                    </div>

                    <div class="fill-pane" id="pane-gradient">
                        <div class="grad-bar" id="grad-bar"></div>
                        <div id="stops" class="stops"></div>
                        <button class="mini-btn wide" id="add-stop">
                            Add stop
                        </button>
                        <div class="field" id="field-angle">
                            <label>Angle</label>
                            <input
                                type="range"
                                id="angle-range"
                                min="0"
                                max="360"
                                step="1"
                            />
                            <input
                                type="number"
                                id="angle-num"
                                class="num"
                                min="0"
                                max="360"
                                step="1"
                            />
                        </div>
                        <div class="field" id="field-cx">
                            <label>Center X</label>
                            <input
                                type="range"
                                id="cx-range"
                                min="-0.5"
                                max="1.5"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="cx-num"
                                class="num"
                                min="-1"
                                max="2"
                                step="0.01"
                            />
                        </div>
                        <div class="field" id="field-cy">
                            <label>Center Y</label>
                            <input
                                type="range"
                                id="cy-range"
                                min="-0.5"
                                max="1.5"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="cy-num"
                                class="num"
                                min="-1"
                                max="2"
                                step="0.01"
                            />
                        </div>
                        <div class="field" id="field-radius">
                            <label>Radius</label>
                            <input
                                type="range"
                                id="radius-range"
                                min="0.05"
                                max="2"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="radius-num"
                                class="num"
                                min="0.01"
                                max="4"
                                step="0.01"
                            />
                        </div>
                    </div>

                    <div class="fill-pane" id="pane-pattern">
                        <div class="asset-grid" id="pattern-grid"></div>
                        <div class="field">
                            <label>Scale</label>
                            <input
                                type="range"
                                id="pattern-scale-range"
                                min="0.02"
                                max="2"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="pattern-scale-num"
                                class="num"
                                min="0.01"
                                max="4"
                                step="0.01"
                            />
                        </div>
                        <div class="field">
                            <label>Offset X</label>
                            <input
                                type="range"
                                id="pattern-ox-range"
                                min="-1"
                                max="1"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="pattern-ox-num"
                                class="num"
                                min="-4"
                                max="4"
                                step="0.01"
                            />
                        </div>
                        <div class="field">
                            <label>Offset Y</label>
                            <input
                                type="range"
                                id="pattern-oy-range"
                                min="-1"
                                max="1"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="pattern-oy-num"
                                class="num"
                                min="-4"
                                max="4"
                                step="0.01"
                            />
                        </div>
                    </div>
                </section>

                <section class="panel" id="panel-stickers">
                    <div class="panel-head">
                        <span class="panel-title">Stickers</span>
                        <div class="head-actions">
                            <button
                                class="mini-btn"
                                id="add-icon"
                                title="Add icon sticker"
                            >
                                Icon+
                            </button>
                            <button
                                class="mini-btn"
                                id="add-text"
                                title="Add text sticker"
                            >
                                T+
                            </button>
                        </div>
                    </div>
                    <div id="sticker-list" class="sticker-list"></div>
                    <div id="sticker-empty" class="empty-hint">
                        No sticker selected
                    </div>

                    <div id="sticker-editor" class="hidden">
                        <div class="subhead">
                            <span id="sticker-kind">ICON</span>
                            <div class="head-actions">
                                <button
                                    class="mini-btn"
                                    id="sticker-up"
                                    title="Move sticker up"
                                >
                                    ↑
                                </button>
                                <button
                                    class="mini-btn"
                                    id="sticker-down"
                                    title="Move sticker down"
                                >
                                    ↓
                                </button>
                                <button
                                    class="mini-btn danger"
                                    id="sticker-delete"
                                    title="Delete sticker"
                                >
                                    ×
                                </button>
                            </div>
                        </div>

                        <div id="sticker-icon-pane">
                            <div class="asset-grid" id="sticker-assets"></div>
                            <div class="field-row">
                                <label class="check"
                                    ><input
                                        type="checkbox"
                                        id="icon-recolor"
                                    /><span class="box"></span>Recolor</label
                                >
                                <button
                                    type="button"
                                    class="color-chip"
                                    id="icon-color"
                                    title="Icon color"
                                >
                                    <span id="icon-color-swatch"></span>
                                </button>
                            </div>
                        </div>

                        <div id="sticker-text-pane">
                            <div class="field">
                                <label>Text</label>
                                <input
                                    id="text-value"
                                    class="text-input"
                                    type="text"
                                    maxlength="200"
                                    spellcheck="false"
                                    placeholder="Park"
                                />
                            </div>
                            <div class="field">
                                <label>Font</label>
                                <select id="text-font"></select>
                            </div>
                            <div class="field">
                                <label>Weight</label>
                                <select id="text-weight">
                                    <option value="300">Light</option>
                                    <option value="400">Regular</option>
                                    <option value="600">Semibold</option>
                                    <option value="700">Bold</option>
                                    <option value="800">Heavy</option>
                                    <option value="900">Black</option>
                                </select>
                            </div>
                            <div class="field-row">
                                <button
                                    type="button"
                                    class="color-chip"
                                    id="text-color"
                                    title="Text color"
                                >
                                    <span id="text-color-swatch"></span>
                                </button>
                                <span class="inline-note">English only</span>
                            </div>
                        </div>

                        <div class="field">
                            <label>X</label>
                            <input
                                type="range"
                                id="sticker-x-range"
                                min="-0.5"
                                max="1.5"
                                step="0.005"
                            />
                            <input
                                type="number"
                                id="sticker-x-num"
                                class="num"
                                min="-2"
                                max="3"
                                step="0.005"
                            />
                        </div>
                        <div class="field">
                            <label>Y</label>
                            <input
                                type="range"
                                id="sticker-y-range"
                                min="-0.5"
                                max="1.5"
                                step="0.005"
                            />
                            <input
                                type="number"
                                id="sticker-y-num"
                                class="num"
                                min="-2"
                                max="3"
                                step="0.005"
                            />
                        </div>
                        <div class="field">
                            <label>Scale</label>
                            <input
                                type="range"
                                id="sticker-scale-range"
                                min="0.02"
                                max="2"
                                step="0.005"
                            />
                            <input
                                type="number"
                                id="sticker-scale-num"
                                class="num"
                                min="0.005"
                                max="8"
                                step="0.005"
                            />
                        </div>
                        <div class="field">
                            <label>Rotate</label>
                            <input
                                type="range"
                                id="sticker-rotation-range"
                                min="-180"
                                max="180"
                                step="1"
                            />
                            <input
                                type="number"
                                id="sticker-rotation-num"
                                class="num"
                                min="-360"
                                max="360"
                                step="1"
                            />
                        </div>
                        <div class="field">
                            <label>Opacity</label>
                            <input
                                type="range"
                                id="sticker-opacity-range"
                                min="0"
                                max="1"
                                step="0.01"
                            />
                            <input
                                type="number"
                                id="sticker-opacity-num"
                                class="num"
                                min="0"
                                max="1"
                                step="0.01"
                            />
                        </div>
                        <div class="field">
                            <label>Offset X</label>
                            <input
                                type="range"
                                id="sticker-ox-range"
                                min="-1"
                                max="1"
                                step="0.005"
                            />
                            <input
                                type="number"
                                id="sticker-ox-num"
                                class="num"
                                min="-2"
                                max="2"
                                step="0.005"
                            />
                        </div>
                        <div class="field">
                            <label>Offset Y</label>
                            <input
                                type="range"
                                id="sticker-oy-range"
                                min="-1"
                                max="1"
                                step="0.005"
                            />
                            <input
                                type="number"
                                id="sticker-oy-num"
                                class="num"
                                min="-2"
                                max="2"
                                step="0.005"
                            />
                        </div>

                        <div class="sub-panel">
                            <div class="subhead">
                                <label class="check"
                                    ><input
                                        type="checkbox"
                                        id="stroke-enabled"
                                    /><span class="box"></span>Stroke</label
                                >
                                <button
                                    type="button"
                                    class="color-chip"
                                    id="stroke-color"
                                    title="Stroke color"
                                >
                                    <span id="stroke-color-swatch"></span>
                                </button>
                            </div>
                            <div class="field">
                                <label>Width</label>
                                <input
                                    type="range"
                                    id="stroke-width-range"
                                    min="0"
                                    max="0.08"
                                    step="0.001"
                                />
                                <input
                                    type="number"
                                    id="stroke-width-num"
                                    class="num"
                                    min="0"
                                    max="0.5"
                                    step="0.001"
                                />
                            </div>
                            <div class="field">
                                <label>Opacity</label>
                                <input
                                    type="range"
                                    id="stroke-opacity-range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                />
                                <input
                                    type="number"
                                    id="stroke-opacity-num"
                                    class="num"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                />
                            </div>
                        </div>

                        <div class="sub-panel">
                            <div class="subhead">
                                <label class="check"
                                    ><input
                                        type="checkbox"
                                        id="shadow-enabled"
                                    /><span class="box"></span>Shadow</label
                                >
                                <button
                                    type="button"
                                    class="color-chip"
                                    id="shadow-color"
                                    title="Shadow color"
                                >
                                    <span id="shadow-color-swatch"></span>
                                </button>
                            </div>
                            <div class="field">
                                <label>Blur</label>
                                <input
                                    type="range"
                                    id="shadow-blur-range"
                                    min="0"
                                    max="0.15"
                                    step="0.002"
                                />
                                <input
                                    type="number"
                                    id="shadow-blur-num"
                                    class="num"
                                    min="0"
                                    max="0.5"
                                    step="0.002"
                                />
                            </div>
                            <div class="field">
                                <label>Opacity</label>
                                <input
                                    type="range"
                                    id="shadow-opacity-range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                />
                                <input
                                    type="number"
                                    id="shadow-opacity-num"
                                    class="num"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                />
                            </div>
                            <div class="field">
                                <label>X</label>
                                <input
                                    type="range"
                                    id="shadow-dx-range"
                                    min="-0.2"
                                    max="0.2"
                                    step="0.002"
                                />
                                <input
                                    type="number"
                                    id="shadow-dx-num"
                                    class="num"
                                    min="-0.5"
                                    max="0.5"
                                    step="0.002"
                                />
                            </div>
                            <div class="field">
                                <label>Y</label>
                                <input
                                    type="range"
                                    id="shadow-dy-range"
                                    min="-0.2"
                                    max="0.2"
                                    step="0.002"
                                />
                                <input
                                    type="number"
                                    id="shadow-dy-num"
                                    class="num"
                                    min="-0.5"
                                    max="0.5"
                                    step="0.002"
                                />
                            </div>
                        </div>
                    </div>
                </section>

                <div class="inspector-foot">
                    <button id="btn-generate-2" class="primary-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v11M8 10l4 4 4-4" />
                            <path d="M4 17v3h16v-3" />
                        </svg>
                        Generate
                    </button>
                </div>
            </aside>
        </div>

        <div id="overlay-root"></div>
        <script src="/renderer.js"></script>
        <script src="/color-picker.js"></script>
        <script src="/art-studio.js"></script>
        <script src="/app.js"></script>
        ""
    </body>
</html>
